ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.example.ApplicationKt.module

database:
  driver: "org.postgresql.Driver"
  url: "$DB_URL:jdbc:postgresql://localhost:5432/HouseHunter"
  user: "$DB_USER:postgres"
  password: "$DB_PASSWORD"
  maxPoolSize: 10

jwt:
    secret: "$JWT_SECRET:change-this-to-a-long-random-string"
    issuer: "alex-build"
    audience: "alex-build-users"
    realm: "Property app"